<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Competitive Exam Registration FORM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>ONLINE COMPETITIVE EXAM REGISTRATION FORM</h1>

    <form id="registrationForm">

        <label>First Name <span>*</span></label>
        <input type="text" id="fname" placeholder="Enter First Name" required>

        <label>Last Name <span>*</span></label>
        <input type="text" id="lname" placeholder="Enter Last Name" required>

        <label>Father Name <span>*</span></label>
        <input type="text" id="father" placeholder="Enter Father Name" required>

        <label>Mother Name <span>*</span></label>
        <input type="text" id="mother" placeholder="Enter Mother Name" required>

        <label>Date of Birth <span>*</span></label>
        <input type="date" id="dob" required>

        <label>Gender <span>*</span></label>
        <select id="gender" required>
            <option value="">-- Select Gender --</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <h2>Educational Details</h2>

        <table>
            <tr>
                <th>Qualification</th>
                <th>Board / University</th>
                <th>Year</th>
                <th>Percentage / CGPA</th>
            </tr>

            <tr>
                <td>10th</td>
                <td><input type="text" id="board10" placeholder="Board Name"></td>
                <td><input type="number" id="year10"></td>
                <td><input type="text" id="cgpa10" placeholder="Percentage / CGPA"></td>
            </tr>

            <tr>
                <td>12th</td>
                <td><input type="text" id="board12" placeholder="Board Name"></td>
                <td><input type="number" id="year12"></td>
                <td><input type="text" id="cgpa12" placeholder="Percentage / CGPA"></td>
            </tr>

            <tr>
                <td>Graduation</td>
                <td><input type="text" id="boardGrad" placeholder="University Name"></td>
                <td><input type="number" id="yearGrad"></td>
                <td><input type="text" id="cgpaGrad" placeholder="Percentage / CGPA"></td>
            </tr>
        </table>

        <label>Upload Passport Size Photo <span>*</span></label>
        <input type="file" id="photo" required>

        <label>Upload Signature <span>*</span></label>
        <input type="file" id="sign" required>

        <div class="buttons">
            <button type="submit" class="submit">Submit</button>
            <button type="reset" class="reset">Reset</button>
        </div>

    </form>

</div>

<script src="script.js"></script>

</body>
</html>
